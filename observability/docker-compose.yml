version: "3.8"

# Stack de observabilidad para el pipeline de voz (main.py corre nativo en
# Windows, NO en un container -- expone /metrics en 127.0.0.1:9091).
#
# Arrancar:  cd observability && docker compose up -d
# Grafana:   http://localhost:3000  (admin/admin, pide cambiar password)
# Prometheus: http://localhost:9090

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: voice-pipeline-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      # host.docker.internal ya funciona por default en Docker Desktop
      # (Windows/Mac). Este mapeo explícito lo hace robusto también en
      # Docker Engine plano (WSL2 sin Desktop, Linux).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: voice-pipeline-grafana
    depends_on:
      - prometheus
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
